services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RSE_APPLY_RERANKING: "false"
      RSE_CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      RSE_APPLY_RERANKING: "false"
      RSE_API_URL: http://api:8000
    depends_on:
      - api
